# Publish a GitHub Release for an annotated tag V<major>.<minor>.<patch> or
# V<major>.<minor>.<patch>-rc<n> whose commit is on master. A release
# candidate (-rc) is published as a prerelease. Nothing is deployed.
name: release

on:
  push:
    tags: ['V*']

permissions:
  contents: read

concurrency:
  group: mo-examples-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  REPO_NAME: mo-examples

jobs:
  build:
    name: validate-and-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate tag name, tag type and source branch
        run: |
          if [[ ! $TAG =~ ^V[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "::error::tag '$TAG' must match V<major>.<minor>.<patch>[-rc<n>]"
            exit 1
          fi
          if [[ $(git cat-file -t "refs/tags/$TAG") != tag ]]; then
            echo "::error::tag '$TAG' must be an annotated tag"
            exit 1
          fi
          SOURCE_COMMIT=$(git rev-parse "refs/tags/$TAG^{commit}")
          test "$SOURCE_COMMIT" = "$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$SOURCE_COMMIT" refs/remotes/origin/master; then
            echo "::error::tag '$TAG' does not point to a commit on master"
            exit 1
          fi

      - name: Generate bilingual changelog
        run: |
          mkdir -p dist
          node scripts/generate-changelog.mjs --version "$TAG" --output dist

      - name: Package source archive
        run: |
          git archive --format=tar.gz --prefix="$REPO_NAME-$TAG/" \
            -o "dist/$REPO_NAME-$TAG.tar.gz" "refs/tags/$TAG"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: mo-examples-${{ github.ref_name }}.spdx.json
          output-file: dist/mo-examples-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Write checksums
        run: |
          cd dist
          sha256sum "$REPO_NAME-$TAG.tar.gz" "$REPO_NAME-$TAG.spdx.json" \
            CHANGELOG.en.md CHANGELOG.zh-CN.md release-notes.md > SHA256SUMS
          cat SHA256SUMS

      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: mo-examples-release-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish-github-release
    if: github.repository == 'inhandnet/mo-examples'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: mo-examples-release-${{ github.ref_name }}
          path: dist/

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          args=()
          if [[ $TAG == *-rc* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" \
            "dist/$REPO_NAME-$TAG.tar.gz" \
            "dist/$REPO_NAME-$TAG.spdx.json" \
            dist/CHANGELOG.en.md \
            dist/CHANGELOG.zh-CN.md \
            dist/release-notes.md \
            dist/SHA256SUMS \
            --verify-tag \
            --title "$TAG" \
            --notes-file dist/release-notes.md \
            "${args[@]}"

name: release

on:
  push:
    tags: ['**']

permissions:
  contents: read

concurrency:
  group: mo-examples-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  REPO_NAME: mo-examples

jobs:
  build:
    name: validate-and-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate tag name, tag type and source branch
        run: |
          node scripts/validate-release-version.mjs "$TAG"
          if [[ $(git cat-file -t "refs/tags/$TAG") != tag ]]; then
            echo "::error::tag '$TAG' must be an annotated tag"
            exit 1
          fi
          SOURCE_COMMIT=$(git rev-parse "refs/tags/$TAG^{commit}")
          test "$SOURCE_COMMIT" = "$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$SOURCE_COMMIT" refs/remotes/origin/master; then
            echo "::error::tag '$TAG' does not point to a commit on master"
            exit 1
          fi

      - name: Validate catalog and policy
        run: |
          node scripts/check-catalog.mjs
          node --test tests/*.test.mjs
          node scripts/check-commit-msg.mjs --revs HEAD

      - name: Generate bilingual changelog
        run: |
          mkdir -p dist
          node scripts/generate-changelog.mjs --version "$TAG" --output dist

      - name: Package source archive
        run: |
          git archive --format=tar.gz --prefix="$REPO_NAME-$TAG/" \
            -o "dist/$REPO_NAME-$TAG.tar.gz" "refs/tags/$TAG"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: mo-examples-${{ github.ref_name }}.spdx.json
          output-file: dist/mo-examples-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Record immutable source and catalog metadata
        run: node scripts/write-release-metadata.mjs "$TAG"

      - name: Write checksums
        run: |
          cd dist
          sha256sum "$REPO_NAME-$TAG.tar.gz" "$REPO_NAME-$TAG.spdx.json" \
            release.json CHANGELOG.en.md CHANGELOG.zh-CN.md release-notes.md > SHA256SUMS
          cat SHA256SUMS

      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: mo-examples-release-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish-github-release
    if: github.repository == 'inhandnet/mo-examples'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: mo-examples-release-${{ github.ref_name }}
          path: dist/

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" dist/* \
            --verify-tag --title "$TAG" --notes-file dist/release-notes.md \
            --prerelease=false --draft
          gh release edit "$TAG" --draft=false

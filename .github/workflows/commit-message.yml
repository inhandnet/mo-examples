name: commit-message

on:
  pull_request:
    branches: [master]
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    name: commit-message
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Check PR title and new commits
        run: node scripts/check-ci.mjs

title: "Video file object detection"
log_level: 2
inputs:
    input0:
        source: /tmp/mo-npu-video/traffic-sample.mp4
        format: h264
        width: 1280
        height: 720
        framerate: 30
        loop: true
        drop: false
models:
    model0:
        model_path: /opt/model_zoo/ONR-OD-8220-yolox-s-lite-mmdet-coco-640x640
        viz_threshold: 0.4
outputs:
    output0:
        sink: kmssink
        width: 1920
        height: 1080
        overlay-perf-type: graph
        main-title: "Video file input - YOLOX-S-Lite"
flows:
    flow0: [input0, model0, output0, [320, 150, 1280, 720]]
